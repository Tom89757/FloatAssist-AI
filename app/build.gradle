plugins {
    id 'com.android.application'
}

// 发布版本与编译日期：versionName 形如 1.0.0+2026-11-25，release APK 文件名同样携带，便于在 GitHub Release 中辨识
def appVersionName = '1.0.0'
def appName = 'FloatAssist'
def buildDate = new Date().format('yyyy-MM-dd')

android {
    namespace 'com.dshgojava.assist'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dshgojava.assist'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "${appVersionName}+${buildDate}"
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                outputFileName = "${appName}-${appVersionName}-${buildDate}-release.apk"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
